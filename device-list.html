<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FarmGuard — Devices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/device-list.css">
</head>
<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <div class="brand-logo"><i class="bi bi-shield-check"></i></div>
            <div class="brand-name" id="headerBrandName">Farm<span>Guard</span></div>
        </div>
        <div class="hdr-right">
            <button class="hdr-btn" title="Notifications"><i class="bi bi-bell"></i></button>
            <button class="hdr-btn dm-btn" onclick="toggleDark()" title="Dark Mode"><i class="bi bi-moon-fill"></i></button>
        </div>
    </div>

    <!-- Page Title -->
    <div class="page-title">All Devices</div>

    <!-- Device List by Ladang -->
    <div id="devList"></div>
</div>

<!-- Bottom Nav -->
<div class="bnav">
    <button class="ni" onclick="navHome()"><i class="bi bi-house-fill"></i><span>Home</span></button>
    <button class="ni act" onclick="navDevice()"><i class="bi bi-cpu"></i><span>Device</span></button>
    <button class="ni" onclick="alert('Analytics page coming soon')"><i class="bi bi-bar-chart-fill"></i><span>Analytics</span></button>
    <button class="ni" onclick="alert('Settings page coming soon')"><i class="bi bi-gear"></i><span>Settings</span></button>
    <button class="ni" onclick="navAccount()"><i class="bi bi-person-fill"></i><span>Account</span></button>
</div>

<script src="js/device-list.js"></script>
</body>
</html>
